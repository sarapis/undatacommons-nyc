title: UN Data Commons × NYC
description: Briefing hub for the UN System Data Commons hackathon project
theme: jekyll-theme-minimal

# The minimal theme ships only a `default` layout, so posts use it too.
permalink: /updates/:year-:month-:day-:title/

# Jekyll drops future-dated posts SILENTLY -- no warning, the page just never
# appears. With collaborators in different timezones that is a trap, and a feed
# that loses entries without saying so is worse than no feed.
future: true
defaults:
  - scope: { path: "", type: posts }
    values: { layout: default }

# Sidebar navigation. `id` matches a page's `nav_id` front matter to mark the
# current page; add an entry here and set nav_id on the page to extend it.
nav:
  - title: Summary
    id: summary
    url: /
  - title: Activity feed
    id: activity
    url: /activity/
  - title: Demo
    id: demo
    url: /demo/benchmarks.html
  - title: Comparability spec
    id: spec
    url: /spec/
  - title: Municipal portals
    id: portals
    url: /artifacts/municipal-latest/
