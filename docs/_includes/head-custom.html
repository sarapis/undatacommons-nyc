<style>
  /* Sidebar nav. The minimal theme has no nav of its own, so this is additive. */
  .site-nav { margin: 18px 0 20px; }
  .site-nav ul { list-style: none; margin: 0; padding: 0; }
  .site-nav li { margin: 0 0 2px; }
  .site-nav a {
    display: block;
    padding: 6px 10px;
    border-left: 3px solid transparent;
    text-decoration: none;
    font-size: 14px;
    line-height: 1.35;
  }
  .site-nav a:hover { background: rgba(0, 0, 0, 0.04); }
  .site-nav a.current {
    border-left-color: #267CB9;
    background: rgba(38, 124, 185, 0.08);
    font-weight: 600;
  }
  /* The theme stacks the sidebar above the content below 960px; keep the nav
     compact there so it does not push the page content off the first screen. */
  @media print, screen and (max-width: 960px) {
    .site-nav { margin: 12px 0 14px; }
    .site-nav ul { display: flex; flex-wrap: wrap; gap: 4px; }
    .site-nav a { border-left: 0; border-bottom: 3px solid transparent; }
    .site-nav a.current { border-left: 0; border-bottom-color: #267CB9; }
  }
</style>
